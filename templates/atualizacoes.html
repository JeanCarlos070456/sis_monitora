{% extends 'base.html' %}{% block content %}<section class="panel"><h2>Trilha de alterações</h2><div class="table-wrap"><table><thead><tr><th>Data</th><th>Autor</th><th>Ação</th><th>Entidade</th><th>Referência</th></tr></thead><tbody>{% for a in auditorias %}<tr><td>{{ a.criado_em|date:'d/m/Y H:i' }}</td><td>{{ a.autor }}</td><td>{{ a.acao }}</td><td>{{ a.entidade }}</td><td>{{ a.referencia }}</td></tr>{% empty %}<tr><td colspan="5">Sem eventos registrados.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
