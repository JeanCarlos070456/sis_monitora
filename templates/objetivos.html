{% extends 'base.html' %}{% block content %}<section class="panel"><h2>Objetivos cadastrados a partir do PDS</h2><div class="table-wrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>Indicadores</th></tr></thead><tbody>{% for i in itens %}<tr><td>{{ i.objetivo_codigo }}</td><td><a href="{% url 'objetivo' i.objetivo_codigo %}">{{ i.objetivo|truncatechars:130 }}</a></td><td>{{ i.total }}</td></tr>{% empty %}<tr><td colspan="3">Sem dados.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
